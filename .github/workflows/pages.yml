name: Deploy Rainbow PWA to GitHub Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build static PWA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/icons
          cat site/indexb64/part-* | base64 -d | gunzip > public/index.html
          cp site/manifest.webmanifest public/manifest.webmanifest
          cp site/sw.js public/sw.js
          python3 - <<'PY'
          import struct, zlib, binascii, math
          from pathlib import Path

          def chunk(kind, data):
              return struct.pack('>I', len(data)) + kind + data + struct.pack('>I', binascii.crc32(kind + data) & 0xffffffff)

          def make_icon(size, path):
              bg = (56, 189, 248)
              rainbow = [(239,68,68),(249,115,22),(234,179,8),(34,197,94),(59,130,246),(139,92,246)]
              cx, cy = size / 2, size * 0.67
              outer, inner = size * 0.39, size * 0.17
              band = (outer - inner) / len(rainbow)
              clouds = [
                  (cx-outer*0.92, cy, size*.095), (cx-outer*.74, cy-size*.035, size*.075), (cx-outer*1.08, cy+size*.012, size*.065),
                  (cx+outer*0.92, cy, size*.095), (cx+outer*.74, cy-size*.035, size*.075), (cx+outer*1.08, cy+size*.012, size*.065),
              ]
              rows=[]
              for y in range(size):
                  row=bytearray([0])
                  for x in range(size):
                      c=bg
                      dx, dy=x-cx, y-cy
                      r=math.hypot(dx,dy)
                      if y <= cy and inner <= r < outer:
                          idx=min(len(rainbow)-1, int((outer-r)/band))
                          c=rainbow[idx]
                      if any((x-qx)**2 + (y-qy)**2 <= qr**2 for qx,qy,qr in clouds):
                          c=(255,255,255)
                      row.extend(c)
                  rows.append(bytes(row))
              raw=b''.join(rows)
              png=b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',size,size,8,2,0,0,0))+chunk(b'IDAT',zlib.compress(raw,9))+chunk(b'IEND',b'')
              Path(path).write_bytes(png)

          make_icon(180, 'public/icons/apple-touch-icon.png')
          make_icon(192, 'public/icons/icon-192.png')
          make_icon(512, 'public/icons/icon-512.png')
          PY

          # Build the separate iPhone-first Rainbow Kids prototype without replacing the live root app.
          mkdir -p public/prototype
          cat site/prototypeb64/part-* | base64 -d | gunzip > public/prototype/index.html
          cp site/prototype/manifest.webmanifest public/prototype/manifest.webmanifest
          cp site/prototype/sw.js public/prototype/sw.js
          cp site/prototype/safe-mic.js public/prototype/safe-mic.js
          cp -R public/icons public/prototype/icons

          # Inject the microphone-safe patch after the main application script.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('public/prototype/index.html')
          s = p.read_text()
          tag = '<script src="./safe-mic.js"></script>'
          if tag not in s:
              s = s.replace('</body>', f'  {tag}\n</body>', 1)
          p.write_text(s)
          PY

          # Inject persistent copyright and commercial-rights notice into both published Rainbow apps.
          python3 - <<'PY'
          from pathlib import Path
          import re

          meta = '<meta name="copyright" content="Copyright © 2026 Ibrahim Alneami — All Rights Reserved">'
          style = '''<style id="ibrahim-copyright-style">
          #ibrahim-copyright-notice{box-sizing:border-box;width:100%;padding:8px 12px calc(8px + env(safe-area-inset-bottom));text-align:center;font:600 10px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#475569;background:rgba(255,255,255,.9);border-top:1px solid rgba(148,163,184,.25)}
          #ibrahim-copyright-notice small{display:block;font-weight:500;opacity:.82}
          </style>'''
          notice = '''<footer id="ibrahim-copyright-notice" aria-label="Copyright and commercial licensing notice">
          <div>Copyright © 2026 Ibrahim Alneami — All Rights Reserved</div>
          <small>Commercial use, resale, redistribution, white-labeling, or sublicensing requires a separate written paid license.</small>
          </footer>'''

          for filename in ('public/index.html', 'public/prototype/index.html'):
              p = Path(filename)
              s = p.read_text()
              if 'name="copyright"' not in s:
                  s = re.sub(r'</head>', meta + '\n' + style + '\n</head>', s, count=1, flags=re.I)
              elif 'ibrahim-copyright-style' not in s:
                  s = re.sub(r'</head>', style + '\n</head>', s, count=1, flags=re.I)
              if 'id="ibrahim-copyright-notice"' not in s:
                  s = re.sub(r'</body>', notice + '\n</body>', s, count=1, flags=re.I)
              p.write_text(s)
          PY

          cp LICENSE public/LICENSE.txt

          test -s public/index.html
          grep -qi '<!doctype html>' public/index.html
          grep -q 'Copyright © 2026 Ibrahim Alneami' public/index.html
          test -s public/prototype/index.html
          grep -q 'Rainbow Kids' public/prototype/index.html
          grep -q 'safe-mic.js' public/prototype/index.html
          grep -q 'Copyright © 2026 Ibrahim Alneami' public/prototype/index.html
          test -s public/prototype/safe-mic.js
          test -s public/LICENSE.txt

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
